name: Build Native And Dex
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK
        uses: android-actions/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Download Android build-tools (d8)
        run: |
          mkdir -p android-sdk
          cd android-sdk
          wget -q https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -q build-tools_r34-linux.zip
          export ANDROID_BUILD_TOOLS=$PWD/android-sdk/34.0.0
          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS" >> $GITHUB_ENV

      - name: Compile C++ to aarch64 .so
        run: |
          mkdir -p output
          $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++ \
          -shared -fPIC -fvisibility=hidden \
          -o output/libtotp-lib.so totp.cpp

      - name: Compile Java & build dex
        run: |
          mkdir -p classes
          javac -d classes com/pjy/totp/TotpManager.java
          $ANDROID_BUILD_TOOLS/d8 --output output/ classes/com/pjy/totp/*.class

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Totp-Build-Result
          path: |
            output/libtotp-lib.so
            output/classes.dex
